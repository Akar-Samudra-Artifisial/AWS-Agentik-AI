[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai-common"
version = "0.1.0"
description = "Shared models, policy constants, phone and logging utilities for ResolveAI."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
    "moto[dynamodb]>=5.0,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
